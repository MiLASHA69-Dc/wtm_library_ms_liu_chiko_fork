<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Book | BiblioTech</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
        
        <!-- Header & Close/Back Button -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div>
                <h3 class="text-xl font-bold text-slate-900">Update Book Record</h3>
                <p class="text-xs text-slate-500 mt-0.5">Modify information for this catalog entry.</p>
            </div>
            <a href="books.html" class="text-slate-400 hover:text-slate-600 p-2 transition-colors" title="Cancel & Return">
                <i class="fa-solid fa-xmark text-lg"></i>
            </a>
        </div>

        <!-- Update Form -->
        <form action="#" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Book Title</label>
                <input type="text" name="title" value="Harry Potter - The Secret Chamber" required 
                       class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">ISBN</label>
                <input type="text" name="isbn" value="978-0439064873" required 
                       class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Author</label>
                <input type="text" name="author" value="J.K. Rowling" required 
                       class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Status</label>
                <select name="status" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                    <option value="av" selected>Available</option>
                    <option value="br">Borrowed</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 flex space-x-3">
                <a href="books.html" class="flex-1 py-3 text-center bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition-all">
                    Cancel
                </a>
                <button type="submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl shadow-md transition-all">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

</body>
</html>
