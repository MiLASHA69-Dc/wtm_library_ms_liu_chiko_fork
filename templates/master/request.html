<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Book | BiblioTech</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 p-6 md:p-12 flex items-center justify-center min-h-screen">
    <div class="max-w-lg w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
        <h3 class="text-xl font-bold text-slate-900 mb-1">Request a Book Loan</h3>
        <p class="text-xs text-slate-500 mb-6">Select an available book and provide your target loan schedule.</p>

        <form onsubmit="event.preventDefault(); alert('Request submitted successfully!');" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Select Book</label>
                <select class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    <option>Harry Potter - The Secret Chamber (Available)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Request Date</label>
                <input type="date" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Return Date</label>
                <input type="date" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg transition-all">Submit Request</button>
        </form>
    </div>
</body>
</html>
