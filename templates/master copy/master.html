<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTech Library</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden transition-opacity"></div>

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out shadow-xl">
            <!-- Brand Header -->
            <div class="h-16 flex items-center justify-between px-6 bg-slate-950 border-b border-slate-800">
                <a href="index.html" class="flex items-center space-x-3 text-white font-bold text-lg">
                    <i class="fa-solid fa-book-open-reader text-indigo-500 text-xl"></i>
                    <span>BiblioTech</span>
                </a>
                <button id="sidebar-close" class="md:hidden text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
                <a href="index.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-house w-5"></i><span>Home</span>
                </a>
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span>
                </a>
                <a href="books.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-book w-5"></i><span>Books Catalog</span>
                </a>
                <a href="authors.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-feather w-5"></i><span>Authors</span>
                </a>
                <a href="genres.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-tags w-5"></i><span>Genres</span>
                </a>
                <a href="request.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition-colors">
                    <i class="fa-solid fa-bookmark w-5"></i><span>Make a Request</span>
                </a>
            </nav>

            <!-- Sidebar Footer / Auth Buttons -->
            <div class="p-4 bg-slate-950 border-t border-slate-800">
                <div class="grid grid-cols-2 gap-2">
                    <a href="login.html" class="block text-center px-3 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-colors">Login</a>
                    <a href="register.html" class="block text-center px-3 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-colors">Register</a>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <!-- Top Header Navbar -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-30 shadow-xs">
                <div class="flex items-center space-x-4">
                    <button id="sidebar-toggle" class="md:hidden text-slate-600 hover:text-slate-900 focus:outline-hidden">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <h1 id="page-heading" class="text-lg font-bold text-slate-800 truncate">Dashboard Overview</h1>
                </div>

                <div class="flex items-center space-x-4">
                    <div class="hidden sm:block relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </span>
                        <input type="text" placeholder="Search catalog..." class="pl-9 pr-4 py-1.5 text-sm bg-slate-100 border-none rounded-full focus:ring-2 focus:ring-indigo-500 w-48 lg:w-64 transition-all">
                    </div>
                </div>
            </header>

            <!-- Main Dynamic Body Slot -->
            <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
                <!-- Page content goes here -->
            </main>

            <!-- Footer -->
            <footer class="bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500">
                &copy; 2026 BiblioTech Library Management System. All rights reserved.
            </footer>
        </div>
    </div>

    <!-- Responsive Sidebar Toggle JS -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const closeBtn = document.getElementById('sidebar-close');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        toggleBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
